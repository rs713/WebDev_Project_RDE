<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="../css/style.css">
        <title>Contact</title>
    </head>

    <body>
      <header class="navbar">
      <div class="logo">RDE Team</div>
      <nav>
        <a href="../pages/offers.html" class="offers-btn">Offers</a>
        <a href="../pages/about.html" class="aboutus-btn">About Us</a>
        <a href="../pages/contact.html" class="contact-btn">Contact</a>
      </nav>
      </header>
      <div class="contact-container">
        <div class="contact-header">
          <h1>Contact Us</h1>
          <h2>Enter Your Details</h2>
        </div>
        
        <div class="contact-form">
          <form id="ContactForm" onsubmit="return validateForm()">
            <div class="form-group">
              <label for="fname">First Name:</label><br>
              <input type="text" id="fname" name="fname" required><br><br>
              
              <label for="lname">Last Name:</label><br>
              <input type="text" id="lname" name="lname" required><br><br>
              
              <label for="email">Email Address:</label><br>
              <input type="email" id="email" name="email" required><br><br>

              <label for="query type">Reason for Inquiry:</label></div>
              <select id="query-type" required>
                <option value="" disabled selected>Select an Option</option>
                <option value="general">General</option>
                <option value="feedback">Feedback</option>
                <option value="technical-support">Technical Support</option>
              </select><br><br>
              
              <label for="message">Enter Your Query:</label><br>
              <textarea id="message" name="message" rows="5" cols="33" required></textarea><br><br>
            </div>
            
            <div class="form-button">
              <button type="submit" class="submit-btn" onclick="submitForm()">Submit</button>
            </div>
            
          </form>
        </div>
        
      </div>
      <section class="nav-back-home-btn">
    <nav><a href="../index.html" class="back-home-btn">Go Back</a></nav></section>

    <footer>
    <p>© 2025 Wheels on Fire. All rights reserved.</p>
    <div class="socials">
      <a href="#">Instagram</a>
      <a href="#">Facebook</a>
      <a href="#">LinkedIn</a>
      <a href="#">YouTube</a>
    </div>
    </footer>
      <script src="../script/main.js"></script>
    </body>

</html>
